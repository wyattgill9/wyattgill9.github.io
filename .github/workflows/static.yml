name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # daily rebuild to pick up MyAnimeList and Letterboxd list changes
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Fill generated sections of media.md
        # a failing source only leaves its own section empty; deploy anyway
        continue-on-error: true
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: python3 .github/sync_media.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
