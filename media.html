<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Backlog &mdash; Wyatt Gill</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <p><a class="back" href="./">&larr; HOME</a></p>
  <h1>Media Backlog</h1>
  <div id="content">Loading&hellip;</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('media.md')
      .then(r => r.text())
      .then(md => md.replace(/^# Media Backlog\n/, ''))
      // blank line between bullets = new group, not one merged list
      .then(md => md.replace(/^(\* .*)\n\n(?=\* )/gm, '$1\n\n<!-- -->\n\n'))
      .then(md => { document.getElementById('content').innerHTML = marked.parse(md); })
      // the trailing reading-list links are the only paragraph marked emits
      .then(() => { document.querySelector('#content p')?.classList.add('lists'); })
      .catch(() => { document.getElementById('content').textContent = 'Failed to load media.md'; });
  </script>
</body>
</html>
