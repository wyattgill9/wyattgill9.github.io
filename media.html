<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Backlog - Wyatt Gill</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
      line-height: 1.6;
      background-color: #222;
      color: #ddd;
    }
    h1 {
      color: #ccc;
      border-bottom: 1px solid #444;
      padding-bottom: 0.5rem;
      margin: 2rem 0 0.5rem;
    }
    h1:first-child { margin-top: 0; }
    h2 { color: #ccc; margin-bottom: 0.5rem; }
    hr { border: none; border-top: 1px solid #444; margin: 2rem 0; }
    ul {
      list-style-type: disc;
      margin: 0 0 0 2rem;
      padding-left: 0;
    }
    ul + ul { margin-top: 1rem; }
    li { margin-bottom: 0.25rem; }
    li p { margin: 0; }
    strong { color: #eee; }
    em { color: #999; }
    a { color: #5eb3f5; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <p><a href="./">&larr; Home</a></p>
  <div id="content">Loading…</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('media.md')
      .then(r => r.text())
      // blank line between bullets = new group, not one merged list
      .then(md => md.replace(/^(\* .*)\n\n(?=\* )/gm, '$1\n\n<!-- -->\n\n'))
      .then(md => { document.getElementById('content').innerHTML = marked.parse(md); })
      .catch(() => { document.getElementById('content').textContent = 'Failed to load media.md'; });
  </script>
</body>
</html>
